name: PLM Runtime Visibility Completion R3 Readonly Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['audit-evidence/consumed/provider-neutral-runtime-visibility-completion-20261011-r3.json']
permissions:
  contents: read
concurrency:
  group: provider-neutral-runtime-visibility-completion-20261011-r3
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.event_name == 'push' && github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' && github.event.head_commit.message == 'PLM runtime visibility readonly once provider-neutral-runtime-visibility-completion-20261011-r3' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gate exact marker-only chain and pins before credential injection
        run: python3 -c 'from readiness.runtime_visibility_completion_r3_executor import load_gate; load_gate()'
      - name: Bounded GET-only exposure inspection, permanent STOP
        env:
          PLM_CF_WORKER_API_TOKEN: ${{ secrets.PLM_CF_WORKER_API_TOKEN }}
        run: python3 -m readiness.runtime_visibility_completion_r3_executor

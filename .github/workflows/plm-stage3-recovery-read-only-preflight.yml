name: PLM Stage3 Recovery Read Only Preflight
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-stage3-recovery-read-only-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.run_attempt == 1 &&
      github.event.before == 'b62dd580a584870f9122407b52d5f5403780c847' &&
      github.event.head_commit.message == 'PLM stage3 recovery verify read-only once 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_STAGE3_RECOVERY_ALLOW: 'false'
      PLM_STAGE3_RECOVERY_OWNER_APPROVAL: UNAPPROVED
      PLM_RECOVERY_PREFLIGHT_CODE_PIN: b62dd580a584870f9122407b52d5f5403780c847
      PLM_RECOVERY_EVENT_BEFORE: ${{ github.event.before }}
      PLM_RECOVERY_EVENT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b62dd580a584870f9122407b52d5f5403780c847
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify recovery Token and audit with Read Token only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_STAGE3_RECOVERY_TOKEN: ${{ secrets.PLM_CF_D1_STAGE3_RECOVERY_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/stage3-recovery-final-preflight.mjs

name: PLM Migration Final Read Only Gate
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/migration-final-inspect.mjs', '.github/workflows/plm-migration-final-inspect.yml']
permissions:
  contents: read
concurrency:
  group: plm-migration-final-inspect
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.event.head_commit.message == 'PLM authorized account-owned Write verify and Read final gate 20261003-0527'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile offline guard
        run: gcc -shared -fPIC -O2 -Wall -Werror readiness/guard/native_guard.c -o "$RUNNER_TEMP/plm-offline-guard.so"
      - name: Guarded fixture tests without credentials or network
        run: env LD_PRELOAD="$RUNNER_TEMP/plm-offline-guard.so" node --import ./readiness/guard/node_guard.mjs --test-isolation=none --test serverless/test-migration-final-inspect.mjs
      - name: Verify account-owned Write once; Read inventory schema bookmark
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_API_TOKEN: ${{ secrets.PLM_CF_D1_API_TOKEN }}
        run: node serverless/migration-final-inspect.mjs

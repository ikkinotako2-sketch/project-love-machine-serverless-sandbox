name: PLM Stage2 Final Read Only Preflight
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-stage2-final-read-only-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.run_attempt == 1 && github.event.before == '868f12603369571fb4a34d504d9cc1da695728c5' && github.event.head_commit.message == 'PLM stage2 token verify read-only once 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_STAGE2_ALLOW: 'false'
      PLM_STAGE2_OWNER_APPROVAL: UNAPPROVED
      PLM_STAGE2_FINAL_CODE_PIN: 868f12603369571fb4a34d504d9cc1da695728c5
      PLM_STAGE2_FINAL_BEFORE: ${{ github.event.before }}
      PLM_STAGE2_FINAL_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 868f12603369571fb4a34d504d9cc1da695728c5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Test Token only and audit D1 with Read Token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_STAGE2_TEST_TOKEN: ${{ secrets.PLM_CF_D1_STAGE2_TEST_TOKEN }}
        run: node serverless/stage2-final-preflight.mjs

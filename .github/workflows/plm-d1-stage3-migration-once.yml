name: PLM D1 Stage3 Owner Approved Migration Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-d1-stage3-migration-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  migrate:
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.run_attempt == 1 &&
      github.event.before == 'f98b1e4e1cd2362cf314499dc34129a5429927c3' &&
      github.event.head_commit.message == 'PLM execute approved stage3 schema once 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_STAGE3_ALLOW: 'true'
      PLM_STAGE3_OWNER_APPROVAL: MIGRATE_STAGE3_FIXED_SCHEMA_ONCE
      PLM_STAGE3_APPROVED_COMMIT: f98b1e4e1cd2362cf314499dc34129a5429927c3
      PLM_STAGE3_EVENT_BEFORE: ${{ github.event.before }}
      PLM_STAGE3_MESSAGE: ${{ github.event.head_commit.message }}
      PLM_STAGE3_SQL_SHA: 012eae70985512f4672546e8f773ed43392754fc95149192b4b0108daf836686
      PLM_STAGE3_PREFLIGHT_RECEIPT_SHA: 2c3f36f52093082072d2764c9dd341b5018519f001293806204f7d67c9cc235d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f98b1e4e1cd2362cf314499dc34129a5429927c3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh gates then maximum one fixed migration HTTP and Read Token post-check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_STAGE3_MIGRATION_TOKEN: ${{ secrets.PLM_CF_D1_STAGE3_MIGRATION_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/d1-stage3-migration-entry.mjs
      - name: Preserve sanitized SENT journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-schema-sent-journal-${{ github.run_id }}
          path: ${{ runner.temp }}/stage3-migration-journal/
          retention-days: 1
          if-no-files-found: ignore

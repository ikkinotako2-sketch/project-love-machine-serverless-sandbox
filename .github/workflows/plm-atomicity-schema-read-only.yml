name: PLM Atomicity Post Migration Schema Read Only
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/atomicity-schema-audit.mjs', '.github/workflows/plm-atomicity-schema-read-only.yml']
permissions:
  contents: read
jobs:
  audit:
    # RETIRED after one successful read-only audit 37099745940.
    if: false
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_AUDIT_PARENT: ${{ github.event.before }}
      PLM_AUDIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fixed Read Token audit only no retry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/atomicity-schema-audit.mjs

name: PLM Atomicity Post Migration Schema Read Only
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/atomicity-schema-audit.mjs', '.github/workflows/plm-atomicity-schema-read-only.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.run_attempt == 1 && github.event.before == 'fd59bc72b3d41412d51ab403435da1db3bbcdf48' && github.event.head_commit.message == 'PLM atomicity preparation read-only audit 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_AUDIT_PARENT: ${{ github.event.before }}
      PLM_AUDIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fixed Read Token audit only no retry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/atomicity-schema-audit.mjs

name: PLM Provider Neutral 0008 Postcheck Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['audit-evidence/consumed/provider-neutral-0008-postcheck-20261010-r1.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: provider-neutral-0008-postcheck-20261010-r1
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.event.head_commit.message == 'PLM 0008 postcheck once provider-neutral-0008-postcheck-20261010-r1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_APPROVED_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 5
      - name: Exact immutable preparation and marker-only chain
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'readiness')
          from provider_neutral_0008_stage_common import local_gate
          local_gate('postcheck')
          PY
      - name: Run exact stage once
        env:
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: python3 readiness/provider_neutral_0008_postcheck_once.py

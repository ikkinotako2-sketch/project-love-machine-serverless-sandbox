name: PLM Generalized Behavior Read Only Preflight Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-generalized-behavior-read-only-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' &&
      github.run_attempt == 1 &&
      github.event.before == '509376029bcfe15dbf2fb57519797062e68c7344' &&
      github.event.head_commit.message == 'PLM generalized behavior read-only preflight once 20261004-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_RT_BEHAVIOR_ALLOW: 'false'
      PLM_RT_BEHAVIOR_OWNER_APPROVAL: UNAPPROVED
      PLM_RT_BEHAVIOR_PIN: 509376029bcfe15dbf2fb57519797062e68c7344
      PLM_RT_BEHAVIOR_BEFORE: ${{ github.event.before }}
      PLM_RT_BEHAVIOR_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 509376029bcfe15dbf2fb57519797062e68c7344
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Token only exact generalized baseline audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/generalized-behavior-preflight.mjs

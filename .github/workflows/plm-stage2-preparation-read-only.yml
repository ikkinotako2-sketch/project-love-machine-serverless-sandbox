name: PLM Stage2 Preparation Read Only
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-stage2-preparation-read-only.yml']
permissions:
  contents: read
jobs:
  preflight:
    # Consumed read-only preparation run 37127572694. Test not approved.
    if: false
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_STAGE2_ALLOW: 'false'
      PLM_STAGE2_PREFLIGHT_CODE_PIN: e916e2a8447af12cce03b96007eed228becd36ed
      PLM_STAGE2_PREFLIGHT_BEFORE: ${{ github.event.before }}
      PLM_STAGE2_PREFLIGHT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e916e2a8447af12cce03b96007eed228becd36ed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Token only exact stage3 schema and fixed stage2 plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/stage2-read-only-preflight.mjs

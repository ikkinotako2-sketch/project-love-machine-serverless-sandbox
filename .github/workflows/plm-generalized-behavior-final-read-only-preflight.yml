name: PLM Generalized Behavior Final Read Only Preflight Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-generalized-behavior-final-read-only-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' &&
      github.run_attempt == 1 &&
      github.event.before == 'df716cbcf3901100965e265ce3e3f3c392496dcb' &&
      github.event.head_commit.message == 'PLM generalized behavior token verify final read-only once 20261004-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_RT_BEHAVIOR_ALLOW: 'false'
      PLM_RT_BEHAVIOR_OWNER_APPROVAL: UNAPPROVED
      PLM_RT_BEHAVIOR_FINAL_PIN: df716cbcf3901100965e265ce3e3f3c392496dcb
      PLM_RT_BEHAVIOR_FINAL_BEFORE: ${{ github.event.before }}
      PLM_RT_BEHAVIOR_FINAL_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df716cbcf3901100965e265ce3e3f3c392496dcb
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Behavior verify only and Read Token only D1 audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_ROUNDTRIP_BEHAVIOR_TOKEN: ${{ secrets.PLM_CF_D1_ROUNDTRIP_BEHAVIOR_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/generalized-behavior-final-preflight.mjs

name: PLM Stage3 Manual Read Only Reconciliation
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-stage3-reconcile-read-only.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.run_attempt == 1 &&
      github.event.before == '137fb1d7a8e5835fa504e6d355a7432c6b5465ff' &&
      github.event.head_commit.message == 'PLM stage3 manual read-only reconciliation 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_RECONCILE_CODE_PIN: 137fb1d7a8e5835fa504e6d355a7432c6b5465ff
      PLM_RECONCILE_BEFORE: ${{ github.event.before }}
      PLM_RECONCILE_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 137fb1d7a8e5835fa504e6d355a7432c6b5465ff
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Token only reconciliation, no retry or mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/stage3-reconcile-read-only.mjs

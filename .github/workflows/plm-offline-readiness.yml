name: PLM Offline Readiness
on:
  push:
    paths: ['readiness/**', 'serverless/**', '.github/workflows/plm-offline-readiness.yml']
  pull_request:
    paths: ['readiness/**', 'serverless/**', '.github/workflows/plm-offline-readiness.yml']
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile trusted offline kernel guard
        run: gcc -shared -fPIC -O2 -Wall -Werror readiness/guard/native_guard.c -o "$RUNNER_TEMP/plm-offline-guard.so"
      - name: Guarded Python offline tests
        env:
          PLM_GUARD_LIBRARY: ${{ runner.temp }}/plm-offline-guard.so
        run: python readiness/guarded_tests.py
      - name: Guarded Node offline tests
        run: >-
          env LD_PRELOAD="$RUNNER_TEMP/plm-offline-guard.so"
          node --import ./readiness/guard/node_guard.mjs --test-isolation=none --test
          readiness/guard/test-node-guard.mjs
          serverless/test-worker.mjs serverless/test-d1-setup.mjs serverless/test-cloudflare-setup.mjs
          serverless/test-read-only-diagnostic.mjs serverless/test-migration-final-inspect.mjs serverless/test-migration-once.mjs serverless/test-post-migration-inspect.mjs serverless/test-stopped-deploy-contract.mjs serverless/test-worker-editor-preflight.mjs serverless/test-worker-content-parser.mjs serverless/test-stopped-deploy-once.mjs serverless/test-backend-schema-read-only.mjs serverless/test-d1-v2-migration.mjs serverless/test-atomicity-test.mjs serverless/test-atomicity-final-preflight.mjs serverless/test-atomicity-execution-entry.mjs serverless/test-durable-stage2-contract.mjs serverless/test-stage3-import-preflight.mjs serverless/test-stage3-import-execution.mjs serverless/test-stage2-read-only-preflight.mjs
      - name: Evidence-scoped post migration gate without credentials or network
        run: env LD_PRELOAD="$RUNNER_TEMP/plm-offline-guard.so" python readiness/post_migration_readiness.py

name: PLM Offline Readiness
on:
  push:
    paths: ['readiness/**', '.github/workflows/plm-offline-readiness.yml']
  pull_request:
    paths: ['readiness/**', '.github/workflows/plm-offline-readiness.yml']
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s readiness -v
      - run: node --test serverless/test-worker.mjs serverless/test-d1-setup.mjs serverless/test-cloudflare-setup.mjs

name: PLM D1 V2 Schema Migration Once Prepared Disabled
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/d1-v2-migration-entry.mjs', '.github/workflows/plm-d1-v2-migration-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  migrate:
    # No owner execution approval. Must remain hard-disabled in this preparation.
    if: false
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_D1_V2_MIGRATION_ALLOW: ${{ vars.PLM_D1_V2_MIGRATION_ALLOW || 'false' }}
      PLM_D1_V2_OWNER_APPROVAL: ${{ vars.PLM_D1_V2_OWNER_APPROVAL || 'UNAPPROVED' }}
      PLM_D1_V2_APPROVED_COMMIT: ${{ vars.PLM_D1_V2_APPROVED_COMMIT || 'UNAPPROVED' }}
      PLM_D1_V2_SQL_SHA: ca2ee1a2c618c5f71b43ade4620d9ded3eb105282be9a610c492632fec59fdc3
      PLM_D1_V2_PREFLIGHT_RECEIPT_SHA: ${{ vars.PLM_D1_V2_PREFLIGHT_RECEIPT_SHA || 'UNAPPROVED' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Future owner-approved one-shot schema migration only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_MIGRATION_V2_TOKEN: ${{ secrets.PLM_CF_D1_MIGRATION_V2_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/d1-v2-migration-entry.mjs

name: PLM D1 V2 Schema Migration Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/d1-v2-migration-entry.mjs', '.github/workflows/plm-d1-v2-migration-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  migrate:
    # Explicit owner approval 2026-10-03; exact independently tested code checkout.
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' && github.event.before == 'a7946f12db41414c401a68a89755fdd16c5a6ff5' && github.event.head_commit.message == 'PLM D1 schema v2 execute approved once 20261003-r1' && github.run_attempt == 1
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_D1_V2_MIGRATION_ALLOW: 'true'
      PLM_D1_V2_OWNER_APPROVAL: MIGRATE_FIXED_SCHEMA_V2_ONCE
      PLM_D1_V2_APPROVED_COMMIT: a7946f12db41414c401a68a89755fdd16c5a6ff5
      PLM_D1_V2_EXECUTION_CODE_COMMIT: a7946f12db41414c401a68a89755fdd16c5a6ff5
      PLM_D1_V2_EVENT_BEFORE: ${{ github.event.before }}
      PLM_D1_V2_ACTIVATION_MESSAGE: ${{ github.event.head_commit.message }}
      PLM_D1_V2_SQL_SHA: ca2ee1a2c618c5f71b43ade4620d9ded3eb105282be9a610c492632fec59fdc3
      PLM_D1_V2_PREFLIGHT_RECEIPT_SHA: 13ae44a8499700f5f7f06925d893b79ca56ac8c58fa0a4b54fa49db24378aa0b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7946f12db41414c401a68a89755fdd16c5a6ff5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Owner-approved one-shot schema migration plus read-only post-check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_MIGRATION_V2_TOKEN: ${{ secrets.PLM_CF_D1_MIGRATION_V2_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/d1-v2-migration-entry.mjs

name: PLM Stage3 Explicit Batch Recovery Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-stage3-explicit-batch-recovery-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    # Registration is not approval. Live entry/history/journal activation needs a separate approval.
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.run_attempt == 1 &&
      github.event.before == '1f26c091af303489bc80490549027c0d0adfc996' &&
      github.event.head_commit.message == 'PLM execute approved explicit batch recovery once 20261003-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_STAGE3_RECOVERY_ALLOW: 'true'
      PLM_STAGE3_RECOVERY_OWNER_APPROVAL: EXECUTE_NEW_EXPLICIT_BATCH_ONCE
      PLM_STAGE3_RECOVERY_APPROVED_COMMIT: 1f26c091af303489bc80490549027c0d0adfc996
      PLM_RECOVERY_EVENT_BEFORE: ${{ github.event.before }}
      PLM_RECOVERY_EVENT_MESSAGE: ${{ github.event.head_commit.message }}
      PLM_RECOVERY_PREFLIGHT_RECEIPT_SHA: 585c75a9bc1fbbd0efb58a825260222c5f53e4d94688337d12ef81634bdfda97
      PLM_STAGE3_RECOVERY_SQL_SHA: c2d3c40447490932df83ecf52797d493787cc2a76a4a4efbc1b0a11a633381c4
      PLM_STAGE3_RECOVERY_REQUEST_SHA: 7a22f2ec5eed90e658f934fb6005289752470193a213b084cfb1f21700278d58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f26c091af303489bc80490549027c0d0adfc996
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Owner approved entry (disabled until exact activation)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_STAGE3_RECOVERY_TOKEN: ${{ secrets.PLM_CF_D1_STAGE3_RECOVERY_TOKEN }}
        run: node serverless/stage3-recovery-execution-entry.mjs
      - name: Preserve sanitized SENT journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-recovery-sent-${{ github.run_id }}
          path: ${{ runner.temp }}/stage3-recovery-journal
          if-no-files-found: ignore
          retention-days: 1

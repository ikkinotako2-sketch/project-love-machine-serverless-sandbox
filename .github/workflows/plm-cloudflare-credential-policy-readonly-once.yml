name: PLM Cloudflare Credential Policy Readonly Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['audit-evidence/consumed/youtube-cloudflare-credential-policy-readonly-20261006-r1.json']
permissions:
  contents: read
concurrency:
  group: youtube-cloudflare-credential-policy-readonly-20261006-r1
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.event.head_commit.message == 'PLM credential policy readonly once youtube-cloudflare-credential-policy-readonly-20261006-r1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_APPROVED_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Verify new durable consumption marker and exact prepared parent
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from readiness.cloudflare_credential_policy_probe import MARKER,PLAN,WORKFLOW,PARENT,validate_marker
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          before=os.environ['PLM_APPROVED_BEFORE']
          assert git('rev-parse','HEAD^')==before
          assert git('rev-parse',before+'^')==PARENT
          assert git('diff','--name-only',before,'HEAD')==MARKER
          assert subprocess.run(['git','cat-file','-e',before+':'+MARKER],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0
          files={p:Path(p).read_bytes() for p in (PLAN,WORKFLOW,'readiness/cloudflare_credential_policy_probe.py')}
          validate_marker(json.loads(Path(MARKER).read_bytes()),json.loads(files[PLAN]),before,files)
          PY
      - name: Exactly two bounded GETs at most, sanitized evidence only
        env:
          PLM_CF_WORKER_API_TOKEN: ${{ secrets.PLM_CF_WORKER_API_TOKEN }}
        run: python3 readiness/cloudflare_credential_policy_probe.py

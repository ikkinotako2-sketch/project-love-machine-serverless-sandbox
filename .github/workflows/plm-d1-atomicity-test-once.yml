name: PLM D1 Atomicity Test Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/atomicity-test-entry.mjs', '.github/workflows/plm-d1-atomicity-test-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    # ONE OWNER APPROVAL: fixed plan only; fresh gate and no prior execution required.
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.run_attempt == 1 && github.event.before == 'b8f7dc93cdae3b300a1a095bd39a1409560955c7' && github.event.head_commit.message == 'PLM execute owner-approved fixed atomicity once 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_ATOMICITY_ALLOW: 'true'
      PLM_ATOMICITY_OWNER_APPROVAL: EXECUTE_FIXED_ATOMICITY_ONCE
      PLM_ATOMICITY_APPROVED_COMMIT: b8f7dc93cdae3b300a1a095bd39a1409560955c7
      PLM_ATOMICITY_EXECUTION_CODE_COMMIT: b8f7dc93cdae3b300a1a095bd39a1409560955c7
      PLM_ATOMICITY_EVENT_BEFORE: ${{ github.event.before }}
      PLM_ATOMICITY_ACTIVATION_MESSAGE: ${{ github.event.head_commit.message }}
      PLM_ATOMICITY_PLAN_SHA: cc4e854c77a5e3115999c7271abeb83974911b353b9afeeab3d8ae08d7d7fb28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8f7dc93cdae3b300a1a095bd39a1409560955c7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Separately approved fixed test only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_ATOMICITY_TEST_TOKEN: ${{ secrets.PLM_CF_D1_ATOMICITY_TEST_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/atomicity-test-entry.mjs
      - name: Preserve bounded audit journal even after cancellation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomicity-journal-${{ github.run_id }}
          path: atomicity-journal/*.json
          retention-days: 1
          if-no-files-found: ignore

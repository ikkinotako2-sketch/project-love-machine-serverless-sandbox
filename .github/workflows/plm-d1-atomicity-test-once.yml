name: PLM D1 Atomicity Test Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/atomicity-test-entry.mjs', '.github/workflows/plm-d1-atomicity-test-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    # HARD DISABLED. Token registration is NOT execution approval.
    if: false
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_ATOMICITY_ALLOW: 'false'
      PLM_ATOMICITY_OWNER_APPROVAL: UNAPPROVED
      PLM_ATOMICITY_APPROVED_COMMIT: UNAPPROVED
      PLM_ATOMICITY_PLAN_SHA: cc4e854c77a5e3115999c7271abeb83974911b353b9afeeab3d8ae08d7d7fb28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: UNAPPROVED
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Separately approved fixed test only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_ATOMICITY_TEST_TOKEN: ${{ secrets.PLM_CF_D1_ATOMICITY_TEST_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/atomicity-test-entry.mjs
      - name: Preserve bounded audit journal even after cancellation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomicity-journal-${{ github.run_id }}
          path: atomicity-journal/*.json
          retention-days: 1
          if-no-files-found: ignore

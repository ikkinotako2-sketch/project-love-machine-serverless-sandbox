name: PLM YouTube Worker Offline
on:
  push:
    paths: ['serverless/youtube-live/**', 'serverless/test-youtube-live*.mjs', 'readiness/youtube-live-worker-successor-plan.json', '.github/workflows/plm-youtube-live-offline.yml']
  pull_request:
    paths: ['serverless/youtube-live/**', 'serverless/test-youtube-live*.mjs', 'readiness/youtube-live-worker-successor-plan.json', '.github/workflows/plm-youtube-live-offline.yml']
permissions:
  contents: read
jobs:
  offline-worker:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile trusted offline kernel guard
        run: gcc -shared -fPIC -O2 -Wall -Werror readiness/guard/native_guard.c -o "$RUNNER_TEMP/plm-offline-guard.so"
      - name: Guarded isolated Worker tests with real local SQLite
        run: >-
          env LD_PRELOAD="$RUNNER_TEMP/plm-offline-guard.so"
          node --import ./readiness/guard/node_guard.mjs --test-isolation=none --test
          serverless/test-youtube-live.mjs serverless/test-youtube-live-sql.mjs

name: PLM V3 Fixed Final Read Only Preflight Once
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-generalized-behavior-v3-final-read-only-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    # Prepare only. No execution approval or Write Token.
    if: >-
      github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' &&
      github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' &&
      github.run_attempt == 1 &&
      github.event.before == 'e3b0688fd18af15e9c9df5c4ae0fb63a32aa5a78' &&
      github.event.head_commit.message == 'PLM v3 fixed final read-only preflight once 20261004-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_RT_V3_ALLOW: 'false'
      PLM_RT_V3_OWNER_APPROVAL: UNAPPROVED
      PLM_RT_V3_FINAL_PIN: e3b0688fd18af15e9c9df5c4ae0fb63a32aa5a78
      PLM_RT_V3_FINAL_BEFORE: ${{ github.event.before }}
      PLM_RT_V3_FINAL_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b0688fd18af15e9c9df5c4ae0fb63a32aa5a78
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Token only residual evidence and migrated schema audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/generalized-behavior-v3-final-preflight.mjs

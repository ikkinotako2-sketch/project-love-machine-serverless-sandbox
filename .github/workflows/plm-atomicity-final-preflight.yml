name: PLM Atomicity Final Read Only Preflight
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['.github/workflows/plm-atomicity-final-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    # Preparation only. Activate exactly one pinned read-only run in a separate commit.
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.run_attempt == 1 && github.event.before == '1233ed94342d113571f2cc6a71eab70ae625ac99' && github.event.head_commit.message == 'PLM atomicity final read-only preflight 20261003-r1'
    concurrency:
      group: plm-cloudflare-sandbox-setup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_ATOMICITY_ALLOW: 'false'
      PLM_ATOMICITY_OWNER_APPROVAL: UNAPPROVED
      PLM_ATOMICITY_PLAN_SHA: cc4e854c77a5e3115999c7271abeb83974911b353b9afeeab3d8ae08d7d7fb28
      PLM_PREFLIGHT_CODE_PIN: 1233ed94342d113571f2cc6a71eab70ae625ac99
      PLM_PREFLIGHT_EVENT_BEFORE: ${{ github.event.before }}
      PLM_PREFLIGHT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1233ed94342d113571f2cc6a71eab70ae625ac99
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Write Token only and audit D1 using Read Token only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_D1_ATOMICITY_TEST_TOKEN: ${{ secrets.PLM_CF_D1_ATOMICITY_TEST_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_HISTORY_GITHUB_TOKEN: ${{ github.token }}
        run: node serverless/atomicity-final-preflight.mjs

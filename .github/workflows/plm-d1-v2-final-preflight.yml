name: PLM D1 V2 Final Read Only Preflight
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/d1-v2-migration.mjs', 'serverless/d1-v2-expected-post.json', '.github/workflows/plm-d1-v2-final-preflight.yml']
permissions:
  contents: read
concurrency:
  group: plm-cloudflare-sandbox-setup
  cancel-in-progress: false
jobs:
  inspect:
    # One authorized read push from the exact supplied parent; reruns rejected.
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' && github.event.before == '75113cc2e7d08cd708b1fe4399cc66c463cfb5c1' && github.event.head_commit.message == 'PLM D1 v2 final read-only preflight 20261003-r1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_V2_PREFLIGHT_PARENT: ${{ github.event.before }}
      PLM_V2_PREFLIGHT_MESSAGE: ${{ github.event.head_commit.message }}
      PLM_D1_V2_MIGRATION_ALLOW: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Account-owned migration token verification and Read Token schema audit only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_MIGRATION_V2_TOKEN: ${{ secrets.PLM_CF_D1_MIGRATION_V2_TOKEN }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/d1-v2-migration.mjs

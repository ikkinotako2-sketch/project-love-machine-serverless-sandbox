name: PLM Post Migration Read Only Audit
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/post-migration-inspect.mjs', '.github/workflows/plm-post-migration-read-only.yml']
permissions:
  contents: read
concurrency:
  group: plm-cloudflare-sandbox-setup
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' && github.event.head_commit.message == 'PLM post-migration read-only audit 20261003-r1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_POST_MIGRATION_AUDIT_MESSAGE: 'PLM post-migration read-only audit 20261003-r1'
      PLM_MIGRATION_WRITE_SECRET_PRESENT: ${{ secrets.PLM_CF_D1_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh D1 read-only and one Worker inventory GET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
        run: node serverless/post-migration-inspect.mjs

name: PLM Migration Once - Owner Approved Single Commit
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/migration-once.mjs', '.github/workflows/plm-migration-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: plm-cloudflare-sandbox-setup
  cancel-in-progress: false
jobs:
  migrate:
    # Owner explicitly approved this fixed SQL once on 2026-10-03 05:45 JST.
    # Only the separately recorded exact commit, branch, and first run attempt.
    if: github.repository == 'ikkinotako2-sketch/project-love-machine-serverless-sandbox' && github.ref == 'refs/heads/plm-offline-readiness-v1-20261002' && github.event_name == 'push' && github.sha == vars.PLM_MIGRATION_APPROVED_COMMIT && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_MIGRATION_EXECUTION_APPROVED: 'true'
      PLM_MIGRATION_APPROVED_COMMIT: ${{ vars.PLM_MIGRATION_APPROVED_COMMIT || 'UNAPPROVED' }}
      PLM_FREE_OWNER_EVIDENCE: 'confirmed'
      PLM_WRITE_SCOPE_OWNER_EVIDENCE: 'specific_account_d1_write_only'
      PLM_REVOCATION_OWNER_READY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One reviewed migration only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_API_TOKEN: ${{ secrets.PLM_CF_D1_API_TOKEN }}
        run: node serverless/migration-once.mjs

name: PLM Migration Once - Disabled Pending Owner Approval
on:
  push:
    branches: [plm-offline-readiness-v1-20261002]
    paths: ['serverless/migration-once.mjs', '.github/workflows/plm-migration-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: plm-cloudflare-sandbox-setup
  cancel-in-progress: false
jobs:
  migrate:
    # Must remain false until the owner's separate final execution approval.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
      PLM_MIGRATION_EXECUTION_APPROVED: 'false'
      PLM_MIGRATION_APPROVED_COMMIT: ${{ vars.PLM_MIGRATION_APPROVED_COMMIT || 'UNAPPROVED' }}
      PLM_FREE_OWNER_EVIDENCE: 'confirmed'
      PLM_WRITE_SCOPE_OWNER_EVIDENCE: 'UNCONFIRMED'
      PLM_REVOCATION_OWNER_READY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One reviewed migration only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLM_D1_DATABASE_ID: ${{ vars.PLM_D1_DATABASE_ID }}
          PLM_CF_ACCOUNT_ISOLATION: ${{ vars.PLM_CF_ACCOUNT_ISOLATION || 'unverified' }}
          PLM_CF_D1_READ_TOKEN: ${{ secrets.PLM_CF_D1_READ_TOKEN }}
          PLM_CF_D1_API_TOKEN: ${{ secrets.PLM_CF_D1_API_TOKEN }}
        run: node serverless/migration-once.mjs
